# PopDAM Bridge Agent — Synology Container Manager
# Import: Container Manager → Project → Create → select this folder
version: "3.8"
services:
  bridge-agent:
    image: ghcr.io/u2giants/popdam-bridge:stable
    container_name: popdam-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      # Canonical container name — anchors the self-update path so it never
      # inherits a mutated name from a previous update cycle.
      POPDAM_CONTAINER_NAME: popdam-bridge
    deploy:
      resources:
        limits:
          cpus: '1.5'    # hard cap — prevents 100% CPU during RAID scrub windows
          memory: 2g
    volumes:
      - /volume1/nas-share:/mnt/nas/mac:ro  # host-path:container-path
      - /volume1/styleguides:/mnt/nas/styleguides:ro  # Style Guides folder (read-only crawl)
      # Persistent data volume: preserves agent key (agent-config.json) across rebuilds.
      # Without this, the agent re-pairs on every container recreate, invalidating the old
      # key mid-flight and causing 401 errors on any in-progress API calls.
      - /volume1/docker/popdam/data:/data
      # Docker socket: required for remote updates from PopDAM UI
      - /var/run/docker.sock:/var/run/docker.sock
