name: review-fixer

# Automatic fixer for `review-finding` issues (popcre/ai-devops
# plan_skinny-review.md, stage G, #2075). The trusted fixer code comes from
# popcre/ai-devops main; it fixes real findings on review-fix/<issue> or closes
# the issue as not planned with evidence. PR updates only retire stale
# automatic fix PRs; they never start another model run (#2171).
# Push and delete triggers were removed (step 1.5, popcre/ai-devops#2402).

on:
  pull_request_target:
    types: [synchronize, closed]
  issues:
    types: [labeled, closed]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: review-finding issue number (empty = every pending one)
        required: false
        type: string
  workflow_call:
    inputs:
      issue:
        description: review-finding issue number (empty = every pending one)
        required: false
        type: string
      runner_labels:
        description: JSON list of runner labels (a self-hosted runner where Codex is logged in)
        type: string
        default: '["self-hosted", "ai-devops-linux"]'

permissions:
  contents: read

jobs:
  fix:
    # Fork PRs never invoke the trusted fixer with base-repo write tokens
    # (#606 finding 2): pull_request_target fires for fork synchronize/closed
    # events too, so require a same-repository head before the job runs.
    if: >-
      (github.event_name != 'issues' || github.event.label.name == 'review-finding') &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.fork == false)
    uses: popcre/ai-devops/.github/workflows/review-fixer.yml@main
    with:
      issue: ${{ github.event.issue.number || inputs.issue }}
      runner_labels: '["self-hosted", "Linux", "X64", "ai-devops-linux"]'
    permissions:
      contents: read
      issues: write
      pull-requests: write
