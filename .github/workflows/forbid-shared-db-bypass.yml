name: Forbid Shared DB Bypass

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  forbid-shared-db-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Reject app-owned shared database changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -E '^supabase/migrations/.*\.sql$'; then
            echo "Shared Supabase migrations must be authored in u2giants/shared-db, not this app repo."
            exit 1
          fi

          scan_files="$(printf '%s\n' "$changed" | grep -E '^(\.github/workflows/|scripts/|package\.json|package-lock\.json)' | grep -v '^\.github/workflows/forbid-shared-db-bypass\.yml$' || true)"
          if [ -n "$scan_files" ]; then
            pattern='supabase[[:space:]]+db[[:space:]]+(push|reset)|supabase[[:space:]]+migration[[:space:]]+repair|schema_migrations|SUPABASE_DB_PASSWORD|SUPABASE_DB_URL|POSTGRES_URL_NON_POOLING'
            # db-data-admin.yml's production launch gate READS the migration ledger through the
            # Supabase Management API with read_only: true. That exact line is allowed; any other
            # match, in that file or anywhere else, still fails.
            allowed_read='^\.github/workflows/db-data-admin\.yml:[0-9]+:[[:space:]]+'"'"'ledger'"'"', coalesce\(\(select jsonb_agg\(version::text\) from supabase_migrations\.schema_migrations\), '"'"'\[\]'"'"'::jsonb\),$'
            # The exception executor proves guard ABSENCE using only these exact
            # catalog/ledger reads. Other reads, appended SQL, and every ledger
            # write in this file or any other file remain forbidden.
            allowed_guard_reads="$(cat <<'READ_ONLY_GUARD_SQL'
          ^scripts/orderlist-settled-exception-executor\.py:[0-9]+:[[:space:]]+"to_regclass\('supabase_migrations\.schema_migrations'\) is not null"$
          ^scripts/orderlist-settled-exception-executor\.py:[0-9]+:[[:space:]]+"exists\(select 1 from supabase_migrations\.schema_migrations where version=%s\)"$
          READ_ONLY_GUARD_SQL
            )"
            hits="$(printf '%s\n' "$scan_files" | xargs grep -HnE "$pattern" | grep -vE "$allowed_read" | grep -vE "$allowed_guard_reads" || true)"
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits"
              echo "App repos may not mutate or repair the shared Supabase database. Put DB changes in u2giants/shared-db."
              exit 1
            fi
          fi

      - name: Verify guard precision and retained write rejection
        run: node --test verification/forbid-shared-db-bypass.test.mjs
