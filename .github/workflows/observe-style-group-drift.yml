name: Observe Style Group Drift

on:
  pull_request:
    paths:
      - '.github/workflows/observe-style-group-drift.yml'
      - 'scripts/observe-style-group-drift*.mjs'
  schedule:
    # Daily series, after the normal nightly rebuild monitor. Keep the clear stage live.
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observe-style-group-drift
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node --test scripts/observe-style-group-drift.test.mjs
  observe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Read aggregate reconciler measurement
        id: observe
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EXTERNAL_SUPABASE_SERVICE_ROLE_KEY }}
          STYLE_GROUP_DRIFT_REPORT_PATH: style-group-drift-report.json
        run: node scripts/observe-style-group-drift.mjs
      - name: Retain aggregate measurement
        id: retain
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: style-group-drift-${{ github.run_id }}
          path: style-group-drift-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Alert on drift or failed measurement
        if: always() && (steps.observe.outcome == 'failure' || steps.retain.outcome == 'failure')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = 'style-group-drift-report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
            const title = '[Production alert] Style-group reconciler drift or missing measurement';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.find(item => item.title === title);
            const failures = [...(report?.failures || [])];
            if ('${{ steps.retain.outcome }}' !== 'success') failures.push('aggregate artifact retention failed');
            if (!failures.length) failures.push('measurement artifact missing');
            const runKind = context.eventName === 'schedule' ? 'scheduled' : 'manually dispatched';
            const body = [
              `The ${runKind} read-only style-group reconciler found assignment drift or could not measure it.`,
              '',
              ...failures.map(failure => `- ${failure}`),
              '',
              `Checked: ${report?.checked_at || 'unknown'}`,
              `Event: ${context.eventName}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Keep the existing clear/rebuild cycle in place. A full clean weekly observation is required before any cutover.',
              '',
              'owner: u2giants',
              '',
              'Posted by Codex chat unknown on GitHub Actions',
            ].join('\n');
            let issueNumber;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
              issueNumber = existing.number;
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
              issueNumber = created.data.number;
            }
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                assignees: ['u2giants'],
              });
            } catch {
              core.warning('Alert posted with owner line; GitHub assignee update failed.');
            }
      - name: Resolve alert after a clean measurement
        if: steps.observe.outcome == 'success' && steps.retain.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('style-group-drift-report.json', 'utf8'));
            const m = report.measurement || {};
            const title = '[Production alert] Style-group reconciler drift or missing measurement';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.find(item => item.title === title && !item.pull_request);
            if (!existing) return;
            const body = [
              'Auto-resolved: the read-only style-group reconciler measured zero drift.',
              '',
              `- assets_missing_or_wrong_group=${m.assets_missing_or_wrong_group}`,
              `- assets_with_unexpected_group=${m.assets_with_unexpected_group}`,
              `- orphan_group_references=${m.orphan_group_references}`,
              `- effective_tag_drifted_assets=${m.effective_tag_drifted_assets}`,
              '',
              `Checked: ${report.checked_at}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'A new alert issue opens automatically if drift returns.',
              '',
              'Posted by Claude chat unknown on GitHub Actions',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
              state: 'closed', state_reason: 'completed',
            });
      - name: Fail on drift or missing measurement
        if: steps.observe.outcome == 'failure' || steps.retain.outcome == 'failure'
        run: exit 1
