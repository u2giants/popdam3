name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install worker dependencies
        run: npm ci --prefix apps/worker

      - name: Build worker
        run: npm run build --prefix apps/worker

      - name: Test worker
        run: npm run test --prefix apps/worker

      - name: Install windows-agent dependencies
        run: npm ci --prefix apps/windows-agent

      - name: Test windows-agent
        run: npm test --prefix apps/windows-agent

      - name: Measurement observer tests
        env:
          POP_MEASURE_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
        run: node --test scripts/lib/indexed-write-measurement.test.mjs scripts/measure-indexed-writes.test.mjs scripts/measure-indexed-writes.pg.test.mjs scripts/orderlist-integration-proof.test.mjs

      - name: Build
        run: npm run build
