name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Measurement observer tests
        env:
          POP_MEASURE_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
        run: node --test scripts/lib/indexed-write-measurement.test.mjs scripts/measure-indexed-writes.test.mjs scripts/measure-indexed-writes.pg.test.mjs scripts/orderlist-integration-proof.test.mjs

      - name: Build
        run: bun run build
