name: PopDAM Windows launcher acceptance
on:
  push:
    branches: [codex/popdam-1200-19-native]
    paths: [.github/workflows/protocol-native.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compare launcher files and prove the installed link
        shell: pwsh
        env:
          VERIFY_LIVE: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP "popdam-launcher-$([guid]::NewGuid())"
          $installed = 'C:\PopDAM'
          $registration = 'HKCU:\Software\Classes\popdam'
          if ((Test-Path -LiteralPath $installed) -or (Test-Path -LiteralPath $registration)) {
            throw 'Expected a clean test runner'
          }
          function Assert-ExplorerTarget([string] $Target) {
            $shell = New-Object -ComObject Shell.Application
            for ($attempt = 0; $attempt -lt 12; $attempt++) {
              foreach ($window in $shell.Windows()) {
                if ($window.FullName -like '*\explorer.exe' -and $window.LocationURL -like 'file:*') {
                  if (([uri]$window.LocationURL).LocalPath.TrimEnd('\') -ieq $Target.TrimEnd('\')) {
                    Write-Host "Explorer opened the exact fixture: $Target"
                    return
                  }
                }
              }
              Start-Sleep -Seconds 1
            }
            throw "Explorer did not open the test folder: $Target"
          }
          function New-PopDamUri([string] $Target) {
            $encoded = [uri]::EscapeDataString($Target).Replace('%28','(').Replace('%29',')').Replace('%27',"'").Replace('%21','!')
            return "popdam://open-folder?path=$encoded"
          }
          try {
            New-Item -ItemType Directory -Path $scratch, $installed | Out-Null
            $files = @('popdam-open.js','popdam-open.bat','install-popdam-protocol.reg','install-popdam-protocol.bat','install-popdam-protocol.ps1')
            foreach ($file in $files) {
              git -c core.autocrlf=false checkout-index --force -- ("public/downloads/$file")
              if ($LASTEXITCODE -ne 0) { throw "Could not reconcile the checked-in bytes: $file" }
            }
            foreach ($file in $files) {
              $source = Join-Path $env:GITHUB_WORKSPACE "public/downloads/$file"
              if ($env:VERIFY_LIVE -eq 'true') {
                $expected = (Get-FileHash -LiteralPath $source).Hash
                foreach ($hostName in @('dam.designflow.app','sg.designflow.app')) {
                  $target = Join-Path $scratch "$hostName-$file"
                  Invoke-WebRequest -Uri "https://$hostName/downloads/$file" -OutFile $target -TimeoutSec 20 -MaximumRedirection 0
                  if ((Get-FileHash -LiteralPath $target).Hash -ne $expected) { throw "Hash differs from the released source: $hostName / $file" }
                  Write-Host "Live bytes match: $hostName / $file"
                }
                $source = Join-Path $scratch "dam.designflow.app-$file"
              }
              Copy-Item -LiteralPath $source -Destination (Join-Path $installed $file)
            }
            $control = Join-Path $scratch 'Independent Explorer control'
            $direct = Join-Path $scratch 'Direct fixture (spaces)'
            $registered = Join-Path $scratch ("Registered fixture (spaces) & 20% + # caf" + [char]0x00E9)
            $parent = Join-Path $scratch 'File parent fallback'
            New-Item -ItemType Directory -Path $control, $direct, $registered, $parent | Out-Null
            $file = Join-Path $parent 'Readme.txt'
            Set-Content -LiteralPath $file -Value 'Synthetic QA fixture'
            Start-Process explorer.exe -ArgumentList ('"{0}"' -f $control)
            Assert-ExplorerTarget $control
            $launcher = Join-Path $installed 'popdam-open.js'
            & cscript.exe //NoLogo $launcher (New-PopDamUri $direct)
            if ($LASTEXITCODE -ne 0) { throw "Direct launcher returned $LASTEXITCODE" }
            Assert-ExplorerTarget $direct
            & reg.exe import (Join-Path $installed 'install-popdam-protocol.reg')
            if ($LASTEXITCODE -ne 0) { throw 'Registry installation failed' }
            $registeredCommand = (Get-Item -LiteralPath "$registration\shell\open\command").GetValue('')
            if ($registeredCommand -cne ('"{0}\System32\wscript.exe" "C:\PopDAM\popdam-open.js" "%1"' -f $env:SystemRoot)) { throw 'Registry did not install the expected native receiver' }
            $originalLauncher = Get-Content -Raw -LiteralPath $launcher
            $witnessPath = Join-Path $installed 'protocol-witness.txt'
            @'
          var fso = new ActiveXObject("Scripting.FileSystemObject");
          var out = fso.CreateTextFile("C:\\PopDAM\\protocol-witness.txt", true, true);
          out.WriteLine(WScript.Arguments.length);
          for (var i = 0; i < WScript.Arguments.length; ++i) out.WriteLine(WScript.Arguments.Item(i));
          out.Close();
          '@ | Set-Content -LiteralPath $launcher -Encoding ascii
            $richUri = New-PopDamUri $registered
            Start-Process $richUri
            for ($attempt = 0; $attempt -lt 14 -and !(Test-Path -LiteralPath $witnessPath); $attempt++) {
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path -LiteralPath $witnessPath) {
              $observed = @(Get-Content -LiteralPath $witnessPath)
              Write-Host "Synthetic ShellExecute input: $richUri"
              Write-Host "Synthetic registered launcher arguments: $($observed -join ' | ')"
            } else {
              Write-Host "Registered launcher did not receive synthetic ShellExecute input"
              Write-Host "WSH process after dispatch: $(Get-Process wscript -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)"
            }
            Set-Content -LiteralPath $launcher -Value $originalLauncher -Encoding ascii
            $standard = Join-Path $scratch 'Registered folder (spaces)'
            New-Item -ItemType Directory -Path $standard | Out-Null
            Start-Process (New-PopDamUri $standard)
            Assert-ExplorerTarget $standard
            Start-Process (New-PopDamUri $registered)
            Assert-ExplorerTarget $registered
            Start-Process (New-PopDamUri $file)
            Assert-ExplorerTarget $parent
          } finally {
            if (Test-Path -LiteralPath $registration) { Remove-Item -LiteralPath $registration -Recurse -Force }
            if (Test-Path -LiteralPath $installed) { Remove-Item -LiteralPath $installed -Recurse -Force }
            if (Test-Path -LiteralPath $scratch) { Remove-Item -LiteralPath $scratch -Recurse -Force }
          }
