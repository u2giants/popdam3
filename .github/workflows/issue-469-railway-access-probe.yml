name: Check PopDAM worker management access (#469)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: issue-469-railway-access-probe
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository == 'u2giants/popdam3' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'u2giants' &&
      github.triggering_actor == 'u2giants'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check scoped worker access
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = "https://backboard.railway.com/graphql/v2"
          target = {
              "projectId": "8645c5fe-ae60-413e-8464-508456c65365",
              "environmentId": "70aef28e-b9f8-4aa6-b902-c9a06aec08d5",
              "serviceId": "f777713f-d0f8-4f9b-9685-37c9090c98ef",
          }
          token = os.environ.get("RAILWAY_TOKEN", "")
          if not token:
              raise SystemExit("Railway project credential is unavailable.")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class CredentialDenied(Exception):
              pass

          browser = urllib.request.build_opener(NoRedirect())

          def query(stage, authorization, document, variables=None):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({"query": document, "variables": variables or {}}).encode(),
                  headers={
                      **authorization,
                      "Content-Type": "application/json",
                      "User-Agent": "curl/8.14.1",
                  },
              )
              try:
                  with browser.open(request, timeout=15) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise CredentialDenied(stage) from None
                  raise SystemExit(f"Railway {stage} did not accept the read request.") from None
              except (OSError, ValueError):
                  raise SystemExit(f"Railway {stage} response could not be read.") from None
              if not isinstance(result, dict):
                  raise SystemExit(f"Railway {stage} returned an unexpected response.")
              errors = result.get("errors") or []
              if any(
                  error.get("message", "").lower() in {"not authorized", "project token not found"}
                  for error in errors
              ):
                  raise CredentialDenied(stage)
              if errors or not isinstance(result.get("data"), dict):
                  raise SystemExit(f"Railway {stage} could not complete the read request.")
              return result["data"]

          authorization = {"Project-Access-Token": token}
          route = "project token"
          try:
              scope = query("project identity", authorization, "query { projectToken { projectId environmentId } }")["projectToken"]
              if scope != {key: target[key] for key in ("projectId", "environmentId")}:
                  raise SystemExit("Railway project credential scope does not match PopDAM production.")
          except CredentialDenied:
              print("Railway rejected the project-token route. Checking the same worker through the bearer route.")
              authorization = {"Authorization": "Bearer " + token}
              route = "bearer"

          try:
              data = query(
                  "deployment lookup",
                  authorization,
                  """
                  query WorkerDeployment($input: DeploymentListInput!) {
                      deployments(input: $input, first: 1) {
                          edges { node { status } }
                      }
                  }
                  """,
                  {"input": {**target, "status": {"in": ["SUCCESS"]}}},
              )
              deployments = data["deployments"]["edges"]
              if len(deployments) != 1 or deployments[0]["node"]["status"] != "SUCCESS":
                  raise SystemExit("No successful deployment was confirmed for the PopDAM worker.")

              variables = query(
                  "worker setting lookup",
                  authorization,
                  """
                  query WorkerVariables($projectId: String!, $environmentId: String!, $serviceId: String) {
                      variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId)
                  }
                  """,
                  target,
              )["variables"]
              if not isinstance(variables, dict) or "DEEPSEEK_API_KEY" not in variables:
                  raise SystemExit("The expected worker setting could not be confirmed.")
          except CredentialDenied as denial:
              raise SystemExit(f"Railway denied the {route} credential at {denial.args[0]}.") from None
          print(f"Verified PopDAM production worker read access through the {route} route.")
          PY
