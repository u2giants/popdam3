name: Publish PopDAM Helper

on:
  push:
    branches: [main]
    paths:
      - "apps/popdam-helper/**"
      - ".github/workflows/publish-popdam-helper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows — Electron Builder ────────────────────────────────────
  build-windows:
    name: Build Windows helper
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/popdam-helper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript + Vite
        run: npm run build

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing for now — add certs later
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: List release artifacts
        shell: powershell
        run: |
          Get-ChildItem release -Recurse -Include "*.exe","*.zip" | Select FullName

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: popdam-helper-latest
          name: POP DAM Helper (latest)
          body: |
            Desktop helper app for Windows and macOS.
            Enables Check Out & Open / Check In workflow from the POP DAM web app.

            **Windows**: download and run the `.exe` installer.
            **macOS**: download the `.dmg`, open it, drag to Applications.

            Requires the POP DAM Helper to be set up once (Settings → root folder mapping).
          files: |
            apps/popdam-helper/release/**/*.exe
            apps/popdam-helper/release/**/*.zip
          prerelease: false

  # ── macOS — Electron Builder ──────────────────────────────────────
  build-mac:
    name: Build Mac helper
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/popdam-helper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript + Vite
        run: npm run build

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing for now — add Apple Developer cert later
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SKIP_NOTARIZATION: "true"
        run: npx electron-builder --mac --publish never

      - name: List release artifacts
        run: find release -name "*.dmg" -o -name "*.zip" | head -20

      - name: Upload macOS installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: popdam-helper-latest
          name: POP DAM Helper (latest)
          files: |
            apps/popdam-helper/release/**/*.dmg
            apps/popdam-helper/release/**/*.zip
          prerelease: false
