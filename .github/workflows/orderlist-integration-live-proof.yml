name: OrderList integration live proof

# Credential setup is limited to a one-time copy of the existing PopDAM
# administrator and viewer test logins from 1Password vault vibe_coding into
# POPDAM_TEST_USER, POPDAM_TEST_PASSWORD, POPDAM_VIEWER_TEST_USER, and
# POPDAM_VIEWER_TEST_PASSWORD. Use existing accounts only: do not create
# accounts, rotate credentials, or change permissions. Transfer values through
# protected op_run environment and stdin pipes; never put them in arguments,
# logs, or repository files. Dispatch on main only after exact-head review and
# the normal merge/deployment gates pass.

on:
  workflow_dispatch:
    inputs:
      deployed_frontend_sha:
        description: Full 40-character PopDAM commit whose frontend is live
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orderlist-integration-live-proof
  cancel-in-progress: false

jobs:
  prove:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact proof workflow commit and ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.105.0

      - name: Verify immutable hosted-preview and production migration evidence
        env:
          BASELINE_EVIDENCE_PATH: ${{ runner.temp }}/orderlist-proof/baseline/backend-evidence.json
        run: node scripts/orderlist-integration-proof.mjs verify-baseline

      - name: Verify proof and deployed frontend source binding
        env:
          DEPLOYED_FRONTEND_SHA: ${{ inputs.deployed_frontend_sha }}
        run: node scripts/orderlist-integration-proof.mjs preflight

      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify production Supabase project before loading access token
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.EXTERNAL_SUPABASE_PROJECT_ID }}
        run: node scripts/orderlist-integration-proof.mjs verify-project

      - name: Generate and verify real production public, API, and integration types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.EXTERNAL_SUPABASE_PROJECT_ID }}
          GENERATED_TYPES_PATH: ${{ runner.temp }}/orderlist-proof/database.types.ts
          GENERATED_TYPES_PROOF_PATH: ${{ runner.temp }}/orderlist-proof/generated/db-generated-types-proof.json
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_ID" = qsllyeztdwjgirsysgai
          mkdir -p "$(dirname "$GENERATED_TYPES_PATH")"
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" --schema public,api,dam > "$GENERATED_TYPES_PATH"
          node scripts/orderlist-integration-proof.mjs verify-types

      - name: Run read-only production administrator and viewer REST acceptance
        env:
          POPDAM_ACCEPTANCE_BASE_URL: https://dam.designflow.app
          SUPABASE_PROJECT_ID: ${{ secrets.EXTERNAL_SUPABASE_PROJECT_ID }}
          DEPLOYED_FRONTEND_SHA: ${{ inputs.deployed_frontend_sha }}
          POPDAM_TEST_USER: ${{ secrets.POPDAM_TEST_USER }}
          POPDAM_TEST_PASSWORD: ${{ secrets.POPDAM_TEST_PASSWORD }}
          POPDAM_VIEWER_TEST_USER: ${{ secrets.POPDAM_VIEWER_TEST_USER }}
          POPDAM_VIEWER_TEST_PASSWORD: ${{ secrets.POPDAM_VIEWER_TEST_PASSWORD }}
          ORDERLIST_PROOF_OUTPUT_DIR: ${{ runner.temp }}/orderlist-proof/live
          ORDERLIST_PROOF_PRIVATE_DIR: ${{ runner.temp }}/orderlist-proof-private
          BASELINE_EVIDENCE_PATH: ${{ runner.temp }}/orderlist-proof/baseline/backend-evidence.json
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/orderlist-integration-proof.mjs accept

      - name: Publish canonical generated-types proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-db-generated-types-4111-${{ github.sha }}
          path: ${{ runner.temp }}/orderlist-proof/generated/db-generated-types-proof.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish exact generated production TypeScript schema
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orderlist-generated-production-types-${{ github.sha }}
          path: ${{ runner.temp }}/orderlist-proof/database.types.ts
          if-no-files-found: error
          retention-days: 90

      - name: Publish canonical live-application proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-db-live-proof-4111-${{ github.sha }}
          path: ${{ runner.temp }}/orderlist-proof/live/db-live-proof.json
          if-no-files-found: error
          retention-days: 90
