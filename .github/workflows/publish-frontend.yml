name: Publish Frontend Image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/publish-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture git metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=format:%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u u2giants --password-stdin

      - name: Build
        run: |
          docker build \
            --build-arg APP_COMMIT=${{ steps.meta.outputs.commit }} \
            --build-arg APP_DATE=${{ steps.meta.outputs.date }} \
            -t ghcr.io/u2giants/popdam-frontend:latest \
            -t ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }} \
            .

      - name: Push
        run: |
          docker push ghcr.io/u2giants/popdam-frontend:latest
          docker push ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }}

      - name: Redeploy on Coolify
        run: |
          curl -s -X POST "https://coolify.designflow.app/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/start" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json"