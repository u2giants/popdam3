name: Publish Frontend Image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/publish-frontend.yml"

concurrency:
  group: publish-frontend
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture git metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=format:%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          APP_DATE: ${{ steps.meta.outputs.date }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u u2giants --password-stdin

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci \
            -t ghcr.io/u2giants/popdam-frontend:latest \
            -t ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }} \
            .

      - name: Push
        run: |
          docker push ghcr.io/u2giants/popdam-frontend:latest
          docker push ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }}

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vps_key root@178.156.180.212 << 'SSHEOF'
            set -e
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u u2giants --password-stdin
            docker pull ghcr.io/u2giants/popdam-frontend:latest

            docker ps -q --filter "ancestor=ghcr.io/u2giants/popdam-frontend" | xargs -r docker stop
            docker ps -aq --filter "ancestor=ghcr.io/u2giants/popdam-frontend" | xargs -r docker rm
            docker rm -f popdam-frontend 2>/dev/null || true

            docker run -d \
              --name popdam-frontend \
              --network coolify \
              --restart unless-stopped \
              -p 8781:80 \
              -l "traefik.enable=true" \
              -l "traefik.http.routers.popdam-http.rule=Host(\`dam.designflow.app\`)" \
              -l "traefik.http.routers.popdam-http.entrypoints=http,web" \
              -l "traefik.http.routers.popdam-http.service=popdam-svc" \
              -l "traefik.http.routers.popdam-https.rule=Host(\`dam.designflow.app\`)" \
              -l "traefik.http.routers.popdam-https.entrypoints=https,websecure" \
              -l "traefik.http.routers.popdam-https.tls=true" \
              -l "traefik.http.routers.popdam-https.tls.certresolver=letsencrypt" \
              -l "traefik.http.routers.popdam-https.service=popdam-svc" \
              -l "traefik.http.services.popdam-svc.loadbalancer.server.port=80" \
              ghcr.io/u2giants/popdam-frontend:latest
          SSHEOF

      - name: VPS Diagnostics
        if: always()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vps_key root@178.156.180.212 \
            'echo "=DOCKER_PS="; docker ps --format "{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}" ; echo "=TRAEFIK_CONTAINER="; docker ps --format "{{.Names}}" | grep -i traefik || echo "no traefik container"; echo "=TRAEFIK_INSPECT="; docker inspect coolify-proxy 2>/dev/null | grep -A5 "Binds\|Mounts" | head -40 || echo "no coolify-proxy container"; echo "=TRAEFIK_PROCESS="; ps aux | grep traefik | grep -v grep; echo "=TRAEFIK_CMDLINE="; cat /proc/$(pgrep -x traefik 2>/dev/null || echo 0)/cmdline 2>/dev/null | tr "\0" " " || echo "no traefik pid"; echo "=TRAEFIK_API="; curl -s http://127.0.0.1:8080/api/http/routers 2>/dev/null | head -500 || echo "api not on 8080"; echo "=HOST_PORT80_TEST="; curl -sv -H "Host: dam.designflow.app" http://127.0.0.1:80/ 2>&1 | head -15; echo "=TRAEFIK_DYNDIRS="; ls -la /traefik/dynamic/ 2>/dev/null || echo "no /traefik/dynamic"; ls -la /data/coolify/proxy/dynamic/ 2>/dev/null || echo "no /data/coolify/proxy/dynamic"; echo "=POPDAM_LABELS="; docker inspect popdam-frontend 2>/dev/null | grep -A2 "Labels" | head -30 || echo "no popdam-frontend"' \
            > /tmp/vps-diag.txt 2>&1 || true
          echo '## VPS Diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/vps-diag.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
