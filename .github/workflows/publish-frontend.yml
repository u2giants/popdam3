name: Publish Frontend Image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/publish-frontend.yml"

concurrency:
  group: publish-frontend
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture git metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=format:%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          APP_DATE: ${{ steps.meta.outputs.date }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u u2giants --password-stdin

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci \
            -t ghcr.io/u2giants/popdam-frontend:latest \
            -t ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }} \
            .

      - name: Push
        run: |
          docker push ghcr.io/u2giants/popdam-frontend:latest
          docker push ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }}

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vps_key root@178.156.180.212 << 'SSHEOF'
            set -e
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u u2giants --password-stdin
            docker pull ghcr.io/u2giants/popdam-frontend:latest

            docker ps -q --filter "ancestor=ghcr.io/u2giants/popdam-frontend" | xargs -r docker stop
            docker ps -aq --filter "ancestor=ghcr.io/u2giants/popdam-frontend" | xargs -r docker rm
            docker rm -f popdam-frontend 2>/dev/null || true

            # Start container - no traefik.docker.network label (let Traefik pick any network)
            docker run -d \
              --name popdam-frontend \
              --network coolify \
              --restart unless-stopped \
              -p 8781:80 \
              -l "traefik.enable=true" \
              -l "traefik.http.routers.popdam-http.rule=Host(\`dam.designflow.app\`)" \
              -l "traefik.http.routers.popdam-http.entrypoints=http" \
              -l "traefik.http.routers.popdam-http.service=popdam-svc" \
              -l "traefik.http.routers.popdam-https.rule=Host(\`dam.designflow.app\`)" \
              -l "traefik.http.routers.popdam-https.entrypoints=https" \
              -l "traefik.http.routers.popdam-https.tls=true" \
              -l "traefik.http.routers.popdam-https.tls.certresolver=letsencrypt" \
              -l "traefik.http.routers.popdam-https.service=popdam-svc" \
              -l "traefik.http.services.popdam-svc.loadbalancer.server.port=80" \
              ghcr.io/u2giants/popdam-frontend:latest

            # Write Traefik file-provider config (base64-encoded to avoid YAML/heredoc issues)
            # Content: HTTP+HTTPS routers for dam.designflow.app pointing to 127.0.0.1:8781
            echo '' | base64 -d > /tmp/popdam-traefik.yml

            # Detect if Traefik runs in a Docker container and write config accordingly
            TRAEFIK_CONT=$(docker ps --format '{{.Names}}' | grep -iE '^coolify-proxy$|^traefik$' | head -1 || true)
            if [ -n "$TRAEFIK_CONT" ]; then
              echo "Traefik container found: $TRAEFIK_CONT"
              DYN_DIR=$(docker inspect "$TRAEFIK_CONT" --format '{{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}' 2>/dev/null | tr ' ' '\n' | grep 'dynamic' | cut -d: -f1 | head -1 || true)
              if [ -n "$DYN_DIR" ]; then
                echo "Traefik dynamic dir on host: $DYN_DIR"
                cp /tmp/popdam-traefik.yml "$DYN_DIR/popdam-frontend.yml"
              else
                echo "No dynamic mount found, using docker cp"
                docker exec "$TRAEFIK_CONT" mkdir -p /traefik/dynamic 2>/dev/null || true
                docker cp /tmp/popdam-traefik.yml "$TRAEFIK_CONT":/traefik/dynamic/popdam-frontend.yml
              fi
              docker kill -s HUP "$TRAEFIK_CONT" 2>/dev/null || true
            else
              echo "No Traefik container, writing to host paths"
              mkdir -p /traefik/dynamic
              cp /tmp/popdam-traefik.yml /traefik/dynamic/popdam-frontend.yml
              pkill -HUP traefik 2>/dev/null || true
            fi

            echo "Container status:"
            docker ps --filter "name=popdam-frontend" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}"
            sleep 3
            echo "Routing test:"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "Host: dam.designflow.app" http://127.0.0.1:80/ || echo "curl failed"
          SSHEOF
