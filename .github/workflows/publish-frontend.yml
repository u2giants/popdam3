name: Publish Frontend Image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/publish-frontend.yml"

concurrency:
  group: publish-frontend
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture git metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=format:%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          APP_DATE: ${{ steps.meta.outputs.date }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u u2giants --password-stdin

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci \
            -t ghcr.io/u2giants/popdam-frontend:latest \
            -t ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }} \
            .

      - name: Push
        run: |
          docker push ghcr.io/u2giants/popdam-frontend:latest
          docker push ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }}

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vps_key root@178.156.180.212 << 'SSHEOF'
            set -e
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u u2giants --password-stdin
            docker pull ghcr.io/u2giants/popdam-frontend:latest

            # Stop and remove any existing popdam-frontend containers
            docker ps -q --filter "ancestor=ghcr.io/u2giants/popdam-frontend" | xargs -r docker stop
            docker ps -aq --filter "ancestor=ghcr.io/u2giants/popdam-frontend" | xargs -r docker rm
            docker rm -f popdam-frontend 2>/dev/null || true

            # Determine container IP after start for file-provider config
            # Start with explicit Traefik labels + docker network hint
            docker run -d \
              --name popdam-frontend \
              --network coolify \
              --restart unless-stopped \
              -p 8781:80 \
              -l "traefik.enable=true" \
              -l "traefik.docker.network=coolify" \
              -l "traefik.http.routers.popdam-http.rule=Host(\`dam.designflow.app\`)" \
              -l "traefik.http.routers.popdam-http.entrypoints=http" \
              -l "traefik.http.routers.popdam-http.service=popdam-svc" \
              -l "traefik.http.routers.popdam-https.rule=Host(\`dam.designflow.app\`)" \
              -l "traefik.http.routers.popdam-https.entrypoints=https" \
              -l "traefik.http.routers.popdam-https.tls.certresolver=letsencrypt" \
              -l "traefik.http.routers.popdam-https.service=popdam-svc" \
              -l "traefik.http.services.popdam-svc.loadbalancer.server.port=80" \
              ghcr.io/u2giants/popdam-frontend:latest

            # Write Traefik file-provider config (file provider watches /traefik/dynamic/)
            mkdir -p /traefik/dynamic
            printf 'http:\n  routers:\n    popdam-file-http:\n      rule: "Host(`dam.designflow.app`)"\n      entrypoints: [http]\n      service: popdam-file-svc\n    popdam-file-https:\n      rule: "Host(`dam.designflow.app`)"\n      entrypoints: [https]\n      tls:\n        certResolver: letsencrypt\n      service: popdam-file-svc\n  services:\n    popdam-file-svc:\n      loadBalancer:\n        servers:\n          - url: "http://127.0.0.1:8781"\n' > /traefik/dynamic/popdam-frontend.yml
            echo "=== /traefik/dynamic/ contents ==="
            ls -la /traefik/dynamic/
            echo "=== popdam-frontend.yml ==="
            cat /traefik/dynamic/popdam-frontend.yml

            echo "=== Container status ==="
            docker ps --filter "name=popdam-frontend" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== Port 8781 binding ==="
            ss -tlnp 2>/dev/null | grep 8781 || echo "port 8781 not bound"

            echo "=== Test container directly ==="
            curl -s -o /dev/null -w "HTTP %{http_code}" http://127.0.0.1:8781/ || echo "curl failed"

            echo "=== Test Traefik routing ==="
            curl -s -o /dev/null -w "HTTP %{http_code}" -H "Host: dam.designflow.app" http://127.0.0.1:80/ || echo "curl failed"

            echo "=== Traefik process (provider flags) ==="
            ps aux 2>/dev/null | grep -i traefik | grep -v grep | tr ' ' '\n' | grep -E 'provider|constraint|network' || echo "no docker provider flags"
          SSHEOF
