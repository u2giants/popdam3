name: Publish Frontend Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "Dockerfile"
      - "Dockerfile.ci"
      - "nginx.conf"
      - ".github/workflows/publish-frontend.yml"

concurrency:
  group: publish-frontend
  cancel-in-progress: true

jobs:
  # ── Verification gate (§11): deploy must not run unless lint passes ──
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture git metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          APP_DATE: ${{ steps.meta.outputs.date }}

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci \
            -t ghcr.io/u2giants/popdam-frontend:latest \
            -t ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }} \
            .

      - name: Push image to GHCR
        run: |
          push_images() {
            docker push ghcr.io/u2giants/popdam-frontend:latest &&
            docker push ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }}
          }

          set +e
          push_images
          push_status=$?

          if [ "$push_status" -ne 0 ] && [ -n "$GHCR_PAT" ]; then
            echo "GITHUB_TOKEN push failed; retrying with GHCR_PAT..."
            docker logout ghcr.io >/dev/null 2>&1 || true
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            login_status=$?
            if [ "$login_status" -eq 0 ]; then
              push_images
              push_status=$?
            else
              push_status=$login_status
            fi
          fi
          set -e

          if [ "$push_status" -ne 0 ]; then
            echo "::error title=GHCR package write denied::Could not push ghcr.io/u2giants/popdam-frontend. Grant repository u2giants/popdam3 Write access under the package's Manage Actions access settings, or set GHCR_PAT to a classic PAT with write:packages owned by a package admin."
            exit 1
          fi
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}

      - name: Deploy via Coolify
        run: |
          echo "Triggering Coolify deployment for app ${{ secrets.COOLIFY_APP_UUID }}..."
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "Coolify deploy trigger failed with HTTP $http_code"
            exit 1
          fi

          echo "Coolify deployment queued. Coolify will pull ghcr.io/u2giants/popdam-frontend:latest and update the production container."
