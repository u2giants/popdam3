name: Publish Frontend Image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/publish-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture git metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=format:%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          APP_DATE: ${{ steps.meta.outputs.date }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u u2giants --password-stdin

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci \
            -t ghcr.io/u2giants/popdam-frontend:latest \
            -t ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }} \
            .

      - name: Push
        run: |
          docker push ghcr.io/u2giants/popdam-frontend:latest
          docker push ghcr.io/u2giants/popdam-frontend:${{ steps.meta.outputs.commit }}

      - name: Configure GHCR credentials and fix Docker network on VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vps_key root@178.156.180.212 << 'SSHEOF'
            # Configure GHCR login
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u u2giants --password-stdin

            # Find the popdam-frontend container
            CONTAINER=$(docker ps -q --filter "ancestor=ghcr.io/u2giants/popdam-frontend:latest" | head -1)
            echo "Container ID: $CONTAINER"
            if [ -n "$CONTAINER" ]; then
              docker inspect $CONTAINER | python3 -c "
import json,sys
d=json.load(sys.stdin)[0]
print('Name:', d['Name'])
print('Networks:', list(d['NetworkSettings']['Networks'].keys()))
traefik_labels = [(k,v) for k,v in d['Config']['Labels'].items() if 'traefik' in k and ('dam.design' in v or 'enable' in k)]
print('Traefik labels (dam.design or enable):', traefik_labels[:5])
"
              # Connect to coolify network if not in it
              docker network connect coolify $CONTAINER 2>/dev/null && echo "Connected to coolify network" || echo "Already connected or error"
            else
              echo "Container not found! Running containers:"
              docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Image}}"
            fi
          SSHEOF

      - name: Redeploy on Coolify
        run: |
          curl -s -X POST "https://coolify.designflow.app/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/start" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json"
