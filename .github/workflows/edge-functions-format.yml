name: Edge Functions Format

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/**/*.ts"
      - ".github/workflows/edge-functions-format.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**/*.ts"
      - ".github/workflows/edge-functions-format.yml"

permissions:
  contents: read

jobs:
  deno-fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Show unformatted files (before fix)
        working-directory: supabase/functions
        run: deno fmt --check . 2>&1 || true

      - name: Format files
        working-directory: supabase/functions
        run: deno fmt .

      - name: Show formatted diff
        run: git diff --stat || true

      - name: Commit formatting changes (if any)
        run: |
          git diff --quiet && echo "✅ All files already formatted" && exit 0
          echo "📝 Committing formatting fixes..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: deno fmt supabase edge functions"
          git push
