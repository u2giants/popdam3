[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Patterns remain relative to the repository root, including for this service's
# apps/worker Docker context. Keep all build inputs and deploy config watched.
watchPatterns = ["/apps/worker/**"]

[deploy]
# Keep IPv4 and permit Meta Model API over the supported IPv6 path.
ipv6EgressEnabled = true
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
