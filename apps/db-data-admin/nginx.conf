server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (#237). nginx drops server-level add_header in any
  # location that sets its own add_header, so /health and /config.js repeat them.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /health {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /config.js {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    access_log off;
    default_type application/javascript;
    add_header Cache-Control "no-store";
    # allowPasswordLogin is a development-only escape hatch. Leave
    # DB_DATA_ADMIN_ALLOW_PASSWORD_LOGIN unset in production: envsubst renders the
    # unset variable as '', which readConfig() treats as disabled.
    return 200 "window.__DB_DATA_ADMIN_CONFIG__ = { supabaseUrl: '${DB_DATA_ADMIN_SUPABASE_URL}', supabaseAnonKey: '${DB_DATA_ADMIN_SUPABASE_ANON_KEY}', authRedirectUrl: '${DB_DATA_ADMIN_AUTH_REDIRECT_URL}', allowPasswordLogin: '${DB_DATA_ADMIN_ALLOW_PASSWORD_LOGIN}' };\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
