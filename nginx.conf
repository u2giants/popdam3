# nginx config for PopDAM SPA
# - serves static assets from /usr/share/nginx/html
# - falls back to index.html for client-side routing (React Router)
# - aggressive caching for hashed assets, no-cache for index.html

server {
    # Runs as non-root (nginx-unprivileged, #239). 8080 is the target port;
    # 80 is kept so the current Coolify/Traefik mapping (port 80) keeps working
    # until Coolify is switched to 8080. Docker lets non-root bind <1024
    # (net.ipv4.ip_unprivileged_port_start=0).
    listen 8080;
    listen [::]:8080;
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Hashed build assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header here drops server-level headers, so repeat them (#236)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # index.html — never cache (so users get new builds immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # add_header here drops server-level headers, so repeat them (#236)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires 0;
    }

    # SPA fallback — every unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}